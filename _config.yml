# Site configuration
# 1. Files excluded from Jekyll builds
# 2. Installed Gems
# 3. Gem settings
# 4. Jekyll settings
# 5. Jekyll collections settings (defaults)
# 6. Site settings
# 7. Site favicons & manifest icons
# 8. Site navigation

# 1. Files excluded from Jekyll builds
exclude:
- CNAME
- Gemfile
- Gemfile.lock
- .jekyll-cache

# 2. Installed Gems
plugins:
- jekyll-sitemap
- jekyll-seo-tag
- jekyll-commonmark
- jekyll-include-cache

# 3. Gem settings
twitter:
  username: GFAbellan # jekyll-seo-tag > Owners twitter username
author: Guillermo Franco Abellán # jekyll-seo-tag > default author
social: # jekyll-seo-tag > social overrides
  name: Guillermo Franco Abellán # jekyll-seo-tag > real name
  links:  # jekyll-seo-tag > social aliases (sameAs)
    - https://twitter.com/GFAbellan
    - https://www.linkedin.com/in/guillermo-franco-abellan-06543b2a3/
    - https://github.com/GFAbellan
    - https://inspirehep.net/authors/1890429

# 4. Jekyll settings
sass:
  style: compressed # Style compression
permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
timezone: Europe/London

# 5. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
    values:
      image: "" # Default image for sharing
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages

# 6. Site settings
encoding: utf-8
lang: en-GB
title: "Guillermo Franco Abellán" # Site name or title, also used in jekyll-seo-tag
logo: "/assets/logos/coffee.png" # Site logo, also used in jekyll-seo-tag

description: "Theoretical physicist working on cosmology, IFIC, University of Valencia."

url: "https://gfabellan.github.io" # Site url, also used in jekyll-seo-tag
baseurl: ""
repo: "https://github.com/GFAbellan/GFAbellan.github.io"
email: "g.francoabellan@ific.uv.es"
css_inline: false # assets/styles.scss is compiled to /assets/styles.css and linked normally

# 7. Site favicons & manifest icons
favicons: # Favicons are also used in the manifest file. Syntax is 'size: path'
  16: '/assets/logos/coffee.png'
  32: '/assets/logos/coffee.png'
  96: '/assets/logos/coffee.png'
  120: '/assets/logos/coffee.png'
  144: '/assets/logos/coffee.png'
  180: '/assets/logos/coffee.png'
  512: '/assets/logos/coffee.png'
  1024: '/assets/logos/coffee.png'

# 8. Site navigation
# Anchors (#...) scroll within the one-page site; other urls link out (e.g. the CV pdf).
navigation_header:
- title: Home
  url: /
- title: Publications
  url: /publications/
- title: Seminars
  url: /seminars/
- title: Codes
  url: /codes/
- title: CV
  url: /cv/
- title: Contact
  url: /contact/

google_site_verification: googlea74707a642609db1.html

# Load custom fonts from fonts.google.com etc
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
  font_urls:
    - https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap

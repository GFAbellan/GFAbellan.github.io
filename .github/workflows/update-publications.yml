name: Update publications from InspireHEP

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate _data/publications.yml and _data/stats.yml
        run: python3 .github/scripts/update_publications.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- _data/publications.yml _data/stats.yml; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml _data/stats.yml
          git commit -m "Update publications from InspireHEP [skip ci]"
          git push

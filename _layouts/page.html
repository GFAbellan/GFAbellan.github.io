---
layout: default
---

<nav id="topnav">
  <div class="nav-inner">
    <a href="{{ "/" | relative_url }}" class="brand">GFA</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      {% for item in site.navigation_header %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
    <button id="theme-toggle" aria-label="Toggle color theme">
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path></svg>
    </button>
  </div>
</nav>

<main>
  {{ content }}
</main>

<footer>
  <p>&copy; {{ site.time | date: "%Y" }} {{ site.author }} <span class="footer-dot">&middot;</span> Last updated: {{ site.time | date: "%-d %B %Y" }}</p>
</footer>

<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    var sun = document.getElementById('icon-sun');
    var moon = document.getElementById('icon-moon');
    var root = document.documentElement;

    function applyTheme(t) {
      root.setAttribute('data-theme', t);
      sun.style.display = t === 'dark' ? 'block' : 'none';
      moon.style.display = t === 'dark' ? 'none' : 'block';
      try { localStorage.setItem('theme', t); } catch (e) {}
    }

    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    applyTheme(stored || 'dark');

    toggle.addEventListener('click', function () {
      var cur = root.getAttribute('data-theme');
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    });

    var navToggle = document.getElementById('nav-toggle');
    var navLinks = document.getElementById('nav-links');
    navToggle.addEventListener('click', function () {
      var open = navLinks.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open);
    });
    navLinks.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { navLinks.classList.remove('open'); });
    });

    var reveal = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('is-visible'); reveal.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(function (el) { reveal.observe(el); });
  })();
</script>

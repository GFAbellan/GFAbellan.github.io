{% assign font_set = site.fonts.sets[site.fonts.active] %}
{% if font_set.font_urls %}
    {% for font in font_set.font_urls %}
        <link rel="preload" as="style" href="{{ font }}" />
        <link href="{{ font }}" rel="stylesheet" media="print" onload="this.media='all'" />
    {% endfor %}
    <noscript>
        {% for font in font_set.font_urls %}
            <link href="{{ font }}" rel="stylesheet" />
        {% endfor %}
    </noscript>
{% endif %}

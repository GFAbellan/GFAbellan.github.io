<section id="codes">
  <div class="section-head reveal">
    <h2>Codes</h2>
    <p>Public software and tools I've built or contributed to.</p>
  </div>
  <div class="code-grid reveal">
    {% for project in site.data.codes %}
      <div class="code-card{% if project.placeholder %} placeholder{% endif %}">
        <h3>{{ project.name }}</h3>
        <p>{{ project.description }}</p>
        <div class="code-links">
          {% if project.github %}<a href="{{ project.github }}">GitHub &rarr;</a>{% endif %}
          {% if project.docs %}<a href="{{ project.docs }}">Docs &rarr;</a>{% endif %}
        </div>
      </div>
    {% endfor %}
  </div>
</section>
